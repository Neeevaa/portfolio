<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#eef4ef" stroke="#2D2A28" stroke-width="4"/>
  <rect x="20" y="20" width="360" height="260" fill="#ffffff" stroke="#2D2A28" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Aromiq Vector Artwork -->
  <g transform="translate(100, 32)">
    <!-- Restaurant Ordering System Window -->
    <rect x="15" y="15" width="170" height="105" rx="6" fill="#f7f2e7" stroke="#2D2A28" stroke-width="2.5"/>
    <line x1="15" y1="36" x2="185" y2="36" stroke="#2D2A28" stroke-width="2"/>
    <circle cx="28" cy="26" r="3" fill="#e8998d"/>
    <circle cx="38" cy="26" r="3" fill="#f7df94"/>
    <circle cx="48" cy="26" r="3" fill="#9ab89e"/>

    <!-- Menu Cards & Table Order Grid -->
    <rect x="25" y="46" width="70" height="66" rx="3" fill="#ffffff" stroke="#2D2A28" stroke-width="1.5"/>
    <rect x="30" y="52" width="60" height="18" rx="2" fill="#eef4ef" stroke="#9ab89e" stroke-width="1"/>
    <line x1="36" y1="61" x2="70" y2="61" stroke="#2D2A28" stroke-width="2" stroke-linecap="round"/>
    
    <rect x="30" y="76" width="60" height="14" rx="2" fill="#fffcee" stroke="#d4b75d" stroke-width="1"/>
    <line x1="36" y1="83" x2="65" y2="83" stroke="#2D2A28" stroke-width="1.5" stroke-linecap="round"/>
    
    <rect x="30" y="94" width="60" height="14" rx="2" fill="#fdf2f0" stroke="#e8998d" stroke-width="1"/>
    <line x1="36" y1="101" x2="75" y2="101" stroke="#2D2A28" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Relational Database Schema / Order Receipt -->
    <rect x="105" y="46" width="70" height="66" rx="3" fill="#ffffff" stroke="#2D2A28" stroke-width="1.5"/>
    <rect x="110" y="52" width="60" height="12" rx="1.5" fill="#7ea8be"/>
    <line x1="114" y1="58" x2="140" y2="58" stroke="#ffffff" stroke-width="1.5"/>
    
    <line x1="112" y1="72" x2="160" y2="72" stroke="#2D2A28" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="112" y1="80" x2="155" y2="80" stroke="#2D2A28" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="112" y1="88" x2="162" y2="88" stroke="#2D2A28" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="112" y1="96" x2="145" y2="96" stroke="#6f8f74" stroke-width="2" stroke-linecap="round"/>
    <line x1="112" y1="104" x2="158" y2="104" stroke="#2D2A28" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Editorial Text -->
  <text x="200" y="195" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="20" font-weight="600" fill="#2D2A28">AROMIQ RESTAURANT PLATFORM</text>
  <text x="200" y="218" text-anchor="middle" font-family="'Caveat', cursive" font-size="16" fill="#6f8f74">Coursework Project // PHP &amp; MySQL Dining System</text>

  <!-- Placeholder Specimen Label -->
  <rect x="40" y="240" width="320" height="26" rx="4" fill="#f7f2e7" stroke="#2D2A28" stroke-width="1.5"/>
  <text x="200" y="258" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#2D2A28">[ aromiq-preview.png ]</text>
</svg>
