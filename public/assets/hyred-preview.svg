<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#fffcee" stroke="#2D2A28" stroke-width="4"/>
  <rect x="20" y="20" width="360" height="260" fill="#ffffff" stroke="#2D2A28" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Hyred Vector Artwork -->
  <g transform="translate(100, 32)">
    <!-- Dashboard App Window -->
    <rect x="15" y="15" width="170" height="105" rx="6" fill="#f7f2e7" stroke="#2D2A28" stroke-width="2.5"/>
    <line x1="15" y1="36" x2="185" y2="36" stroke="#2D2A28" stroke-width="2"/>
    <circle cx="28" cy="26" r="3" fill="#e8998d"/>
    <circle cx="38" cy="26" r="3" fill="#f7df94"/>
    <circle cx="48" cy="26" r="3" fill="#9ab89e"/>

    <!-- Skill Progress Bars & Assessment Cards -->
    <rect x="25" y="46" width="60" height="30" rx="3" fill="#ffffff" stroke="#2D2A28" stroke-width="1.5"/>
    <rect x="30" y="52" width="35" height="5" rx="1.5" fill="#f7df94"/>
    <rect x="30" y="62" width="48" height="6" rx="2" fill="#e9f1f5" stroke="#2D2A28" stroke-width="1"/>
    <rect x="30" y="62" width="32" height="6" rx="2" fill="#7ea8be"/>

    <rect x="95" y="46" width="80" height="30" rx="3" fill="#ffffff" stroke="#2D2A28" stroke-width="1.5"/>
    <line x1="102" y1="54" x2="140" y2="54" stroke="#2D2A28" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="102" y1="62" x2="165" y2="62" stroke="#9ab89e" stroke-width="2" stroke-linecap="round"/>

    <!-- Recharts Bar Chart Concept -->
    <rect x="25" y="84" width="150" height="30" rx="3" fill="#ffffff" stroke="#2D2A28" stroke-width="1.5"/>
    <rect x="35" y="96" width="14" height="14" fill="#e8998d" stroke="#2D2A28" stroke-width="1"/>
    <rect x="55" y="90" width="14" height="20" fill="#f7df94" stroke="#2D2A28" stroke-width="1"/>
    <rect x="75" y="93" width="14" height="17" fill="#7ea8be" stroke="#2D2A28" stroke-width="1"/>
    <rect x="95" y="87" width="14" height="23" fill="#9ab89e" stroke="#2D2A28" stroke-width="1"/>
    <line x1="120" y1="94" x2="165" y2="94" stroke="#2D2A28" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="120" y1="102" x2="150" y2="102" stroke="#c76e61" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Editorial Text -->
  <text x="200" y="195" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="20" font-weight="600" fill="#2D2A28">HYRED CAREER CO-PILOT</text>
  <text x="200" y="218" text-anchor="middle" font-family="'Caveat', cursive" font-size="16" fill="#c76e61">Student Career Prep &amp; Skill Visualisation</text>

  <!-- Placeholder Specimen Label -->
  <rect x="40" y="240" width="320" height="26" rx="4" fill="#f7f2e7" stroke="#2D2A28" stroke-width="1.5"/>
  <text x="200" y="258" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#2D2A28">[ hyred-preview.png ]</text>
