<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f2eff6" stroke="#2D2A28" stroke-width="4"/>
  <rect x="20" y="20" width="360" height="260" fill="#ffffff" stroke="#2D2A28" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- Space Apps & Venue Coordination vector artwork -->
  <g transform="translate(130, 40)">
    <!-- Planet / Orbit -->
    <circle cx="70" cy="50" r="32" fill="#a799b7" stroke="#2D2A28" stroke-width="2.5"/>
    <ellipse cx="70" cy="50" rx="55" ry="14" fill="none" stroke="#2D2A28" stroke-width="2" stroke-dasharray="4 4" transform="rotate(-15 70 50)"/>
    <!-- Small rocket / satellite -->
    <g transform="translate(100, 20) rotate(45)">
      <polygon points="0,0 8,16 -8,16" fill="#e8998d" stroke="#2D2A28" stroke-width="1.5"/>
      <polygon points="-5,16 5,16 0,22" fill="#f7df94"/>
    </g>
    <!-- Stars -->
    <circle cx="25" cy="25" r="2.5" fill="#f7df94" stroke="#2D2A28" stroke-width="1"/>
    <circle cx="118" cy="80" r="2" fill="#f7df94" stroke="#2D2A28" stroke-width="1"/>
  </g>
  <!-- Text -->
  <text x="200" y="195" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="20" font-weight="600" fill="#2D2A28">NASA SPACE APPS CHALLENGE 2025</text>
  <text x="200" y="218" text-anchor="middle" font-family="'Caveat', cursive" font-size="16" fill="#756488">Venue Operations Lead • 1000+ Hackathon Participants</text>
  <!-- Placeholder label on the image -->
  <rect x="40" y="240" width="320" height="26" rx="4" fill="#f7f2e7" stroke="#2D2A28" stroke-width="1.5"/>
  <text x="200" y="258" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#2D2A28">[ nasa-space-apps-lead.png ]</text>
</svg>
