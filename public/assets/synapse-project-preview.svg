    <rect x="10" y="15" width="150" height="95" rx="6" fill="#f7f2e7" stroke="#2D2A28" stroke-width="2.5"/>
    <line x1="10" y1="36" x2="160" y2="36" stroke="#2D2A28" stroke-width="2"/>
    <circle cx="24" cy="25" r="3" fill="#e8998d"/>
    <circle cx="34" cy="25" r="3" fill="#f7df94"/>
    <circle cx="44" cy="25" r="3" fill="#9ab89e"/>
    <!-- Sidebar -->
    <rect x="18" y="44" width="32" height="58" rx="3" fill="#e9f1f5" stroke="#2D2A28" stroke-width="1.5"/>
