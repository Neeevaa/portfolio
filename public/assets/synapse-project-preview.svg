    <line x1="66" y1="53" x2="110" y2="53" stroke="#2D2A28" stroke-width="2" stroke-linecap="round"/>
    <line x1="66" y1="60" x2="95" y2="60" stroke="#9ab89e" stroke-width="2" stroke-linecap="round"/>
    <rect x="58" y="76" width="94" height="26" rx="3" fill="#ffffff" stroke="#2D2A28" stroke-width="1.5"/>
    <line x1="66" y1="85" x2="120" y2="85" stroke="#2D2A28" stroke-width="2" stroke-linecap="round"/>
    <line x1="66" y1="92" x2="105" y2="92" stroke="#e8998d" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Text -->
  <text x="200" y="195" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="20" font-weight="600" fill="#2D2A28">SYNAPSE PROJECT PREVIEW</text>
  <text x="200" y="218" text-anchor="middle" font-family="'Caveat', cursive" font-size="16" fill="#6f8f74">AI-Assisted Software Project Management (Final-Year MCA)</text>
