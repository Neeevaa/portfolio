<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#fdf2f0" stroke="#2D2A28" stroke-width="4"/>
  <rect x="20" y="20" width="360" height="260" fill="#ffffff" stroke="#2D2A28" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- Yarn ball & crochet hook vector artwork -->
  <g transform="translate(140, 50)">
    <circle cx="60" cy="60" r="45" fill="#e8998d" stroke="#2D2A28" stroke-width="3"/>
    <path d="M30 45 C45 30, 75 30, 90 45" stroke="#ffffff" stroke-width="3" fill="none"/>
    <path d="M25 60 C40 50, 80 50, 95 60" stroke="#ffffff" stroke-width="3" fill="none"/>
    <path d="M30 75 C45 85, 75 85, 90 75" stroke="#ffffff" stroke-width="3" fill="none"/>
    <!-- Hook -->
    <line x1="105" y1="15" x2="35" y2="105" stroke="#2D2A28" stroke-width="5" stroke-linecap="round"/>
    <path d="M105 15 Q115 10 115 18 Q115 24 108 24" stroke="#2D2A28" stroke-width="4" fill="none"/>
  </g>
  <!-- Brand text -->
  <text x="200" y="195" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="22" font-weight="600" fill="#2D2A28">THE KNOTIQUE</text>
  <text x="200" y="220" text-anchor="middle" font-family="'Caveat', cursive" font-size="16" fill="#c76e61">Handcrafted Crochet &amp; Brand Studio</text>
  <!-- Placeholder label on the image -->
  <rect x="50" y="240" width="300" height="26" rx="4" fill="#f7f2e7" stroke="#2D2A28" stroke-width="1.5"/>
  <text x="200" y="258" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#2D2A28">[ the-knotique-brand-logo.png ]</text>
</svg>
