    <rect x="15" y="15" width="170" height="105" rx="6" fill="#f7f2e7" stroke="#2D2A28" stroke-width="2.5"/>
    <rect x="25" y="26" width="150" height="14" rx="2" fill="#a799b7" opacity="0.35"/>
    <line x1="25" y1="50" x2="115" y2="50" stroke="#2D2A28" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="60" x2="105" y2="60" stroke="#2D2A28" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="70" x2="110" y2="70" stroke="#2D2A28" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="80" x2="95" y2="80" stroke="#2D2A28" stroke-width="2" stroke-linecap="round"/>
